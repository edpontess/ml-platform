[project]
name = "ml-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "edson.pontes@ctw.bmwgroup.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-platform = "ml_platform:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
