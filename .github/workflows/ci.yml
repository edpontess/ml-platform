name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Download UCI HAR dataset
        run: |
          DATA_ROOT="data/human+activity+recognition+using+smartphones"
          mkdir -p "$DATA_ROOT"
          curl -fL --retry 3 --silent --show-error \
            https://archive.ics.uci.edu/static/public/240/human+activity+recognition+using+smartphones.zip \
            -o /tmp/uci-har.zip
          unzip -q /tmp/uci-har.zip -d "$DATA_ROOT"
          unzip -q "$DATA_ROOT/UCI HAR Dataset.zip" -d "$DATA_ROOT"

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q
