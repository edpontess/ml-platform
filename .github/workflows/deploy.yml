name: Build and Deploy ML API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ml-platform-api
  ECS_CLUSTER: ml-platform-cluster
  ECS_SERVICE: ml-platform-api-service
  ECS_TASK_FAMILY: ml-platform-api
  CONTAINER_NAME: ml-platform-api

jobs:
  verify-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Check CI status for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          conclusion=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT_SHA" \
            -f status=completed \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')

          if [ "$conclusion" -eq 0 ]; then
            echo "::error::No successful CI run found for commit $COMMIT_SHA on main"
            exit 1
          fi

          echo "CI passed for commit $COMMIT_SHA"
  deploy:
    name: Build Docker Image and Deploy to ECS
    needs: verify-ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download champion model from S3
        run: |
            aws s3 sync \
            s3://ml-platform-model-artifacts-974268348848/champion/ \
            models/champion/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker buildx build \
            --platform linux/arm64 \
            --push \
            --tag "$IMAGE_URI" \
            .

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Prepare ECS task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json

      - name: Update container image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
